{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "meshchatnext.serviceAccountName" . }}
    labels:
        {{- include "meshchatnext.labels" . | nindent 8 }}
    {{- with .Values.serviceAccount.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
