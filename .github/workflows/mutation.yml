# Optional mutation testing (manual or weekly). Not part of primary CI.
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/upload-artifact@v7.0.2 cf430e030ddbb5b0abf93d22962f4752f3646cd9

name: Mutation testing

on:
    workflow_dispatch:
        inputs:
            backend:
                description: Run backend mutmut
                type: boolean
                default: true
            frontend:
                description: Run frontend MeshMut
                type: boolean
                default: true
            min_score:
                description: Minimum mutation score percentage (0 to skip gate)
                type: string
                default: "50"
    schedule:
        - cron: "0 6 * * 0"

permissions:
    contents: read

concurrency:
    group: mutation-${{ github.workflow }}-${{ github.ref }}
    # Preserve a running full qualification; a later request waits its turn.
    cancel-in-progress: false

env:
    HARDEN_ENDPOINTS: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        uploads.github.com:443
        *.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        *.actions.githubusercontent.com:443
        *.githubapp.com:443
        *.blob.core.windows.net:443
        ghcr.io:443
        azure.archive.ubuntu.com:80
        archive.ubuntu.com:80
        *.ubuntu.com:443
        packages.microsoft.com:443
        pypi.org:443
        upload.pypi.org:443
        *.pythonhosted.org:443
        registry.npmjs.org:443
        nodejs.org:443
        go.dev:443
        golang.org:443
        proxy.golang.org:443
        sum.golang.org:443
        sh.rustup.rs:443
        static.rust-lang.org:443
        static.crates.io:443
        index.crates.io:443
        api.adoptium.net:443
        dl.google.com:443
        maven.google.com:443
        repo.maven.apache.org:443
        services.gradle.org:443
        repo.gradle.org:443
        plugins.gradle.org:443
        chaquo.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        download.docker.com:443
        production.cloudfront.docker.com:443
        mirror.gcr.io:443
        *.sigstore.dev:443
        check.trivy.dev:443
        cgr.dev:443
        *.cgr.dev:443
        dl-cdn.alpinelinux.org:443
        *.alpinelinux.org:443
        *.r2.cloudflarestorage.com:443
        *.storage.bunnycdn.com:443
        cdn.quad4.io:443
        dl.flathub.org:443
        flathub.org:443
        api.securityscorecards.dev:443
        meshchatx.com:443
        cdn.playwright.dev:443
        playwright.download.prss.microsoft.com:443
        *.prss.microsoft.com:443
        firefox.settings.services.mozilla.com:443
        *.mozilla.com:443
        storage.googleapis.com:443
        *.stepsecurity.io:443
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    PYTHON_VERSION: "3.14"
    NODE_VERSION: "24"
    UV_VERSION: "0.11.15"
    PNPM_VERSION: "12.7.0"

jobs:
    backend:
        name: Backend mutation (IDs ending in ${{ matrix.digits }})
        if: ${{ github.event_name == 'schedule' || inputs.backend != false }}
        runs-on: ubuntu-latest
        timeout-minutes: 360
        strategy:
            fail-fast: false
            max-parallel: 5
            matrix:
                # Mutmut IDs end in a decimal digit. These groups cover each ID once.
                digits: ["01", "28", "39", "47", "56"]
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: ./.github/actions/setup-dev-environment
              with:
                  tree-signer-hash: ${{ vars.NEXT_TREE_SIGNER_HASH }}
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Backend mutation (mutmut)
              env:
                  MUTMUT_TARGET: "meshchatnext.src.backend.meshchat_utils*[${{ matrix.digits }}]"
                  MUTMUT_MAX_CHILDREN: "2"
              run: |
                  set -euo pipefail
                  # Sample resource headroom throughout this long-running hosted job.
                  (
                      while :; do
                          date -u
                          free -m
                          df -h .
                          sleep 120
                      done
                  ) &
                  sampler=$!
                  trap 'kill "$sampler" 2>/dev/null || true' EXIT
                  bash scripts/ci/mutation-backend.sh

            - name: Retain baseline failure evidence
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: mutation-backend-diagnostics-${{ matrix.digits }}
                  path: temp-tests/mutation-diagnostics/
                  if-no-files-found: warn
                  retention-days: 7

            - name: Upload backend shard report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: mutation-backend-${{ matrix.digits }}
                  path: mutmut-cicd-stats.json
                  if-no-files-found: error

    backend-score:
        name: Backend mutation score
        needs: backend
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false
            - name: Download backend shard reports
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  pattern: mutation-backend-*
                  path: backend-reports
            - name: Check the combined backend score
              env:
                  MIN_SCORE: ${{ github.event_name == 'schedule' && '50' || github.event.inputs.min_score }}
              run: |
                  python3 scripts/ci/mutation-score-check.py --min-score "$MIN_SCORE" \
                    --mutmut-stats backend-reports/mutation-backend-01/mutmut-cicd-stats.json \
                    --mutmut-stats backend-reports/mutation-backend-28/mutmut-cicd-stats.json \
                    --mutmut-stats backend-reports/mutation-backend-39/mutmut-cicd-stats.json \
                    --mutmut-stats backend-reports/mutation-backend-47/mutmut-cicd-stats.json \
                    --mutmut-stats backend-reports/mutation-backend-56/mutmut-cicd-stats.json

    frontend:
        name: Frontend mutation
        if: ${{ github.event_name == 'schedule' || inputs.frontend != false }}
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false

            - name: Set up development environment
              uses: ./.github/actions/setup-dev-environment
              with:
                  tree-signer-hash: ${{ vars.NEXT_TREE_SIGNER_HASH }}
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Frontend mutation (MeshMut sample)
              env:
                  MIN_SCORE: ${{ github.event_name == 'schedule' && '50' || github.event.inputs.min_score }}
              run: |
                  set -euo pipefail
                  node scripts/mutation/run.mjs \
                    --source meshchatnext/src/frontend/js/rnode/Capabilities.js \
                    --source meshchatnext/src/frontend/js/mapLinkUtils.js \
                    --max-per-file 30 \
                    --min-score "${MIN_SCORE}"

            - name: Upload frontend mutation report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: mutation-frontend
                  path: reports/mutation/
                  if-no-files-found: ignore
