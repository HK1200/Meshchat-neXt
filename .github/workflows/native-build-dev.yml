# Native Electron builds for Windows, macOS arm64, and macOS x86_64 on every push/PR to master.
# Kept separate from ci.yml so the main test suite can finish without waiting on
# the per-arch macOS builds, while still always verifying all desktop targets.
#
# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v6.0.1            8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/setup-python@v6.2.0        a309ff8b426b58ec0e2a45f0f869d46889d02405
#   actions/cache@v6.1.0 55cc8345863c7cc4c66a329aec7e433d2d1c52a9

name: Native build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            release_artifact_run:
                description: "Existing merged 0.1.7 Windows artifact run to verify without rebuilding"
                type: string
                required: false
                default: ""

permissions:
    contents: read

concurrency:
    group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    HARDEN_ENDPOINTS: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        uploads.github.com:443
        *.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        *.actions.githubusercontent.com:443
        *.githubapp.com:443
        *.blob.core.windows.net:443
        ghcr.io:443
        azure.archive.ubuntu.com:80
        archive.ubuntu.com:80
        *.ubuntu.com:443
        packages.microsoft.com:443
        pypi.org:443
        upload.pypi.org:443
        *.pythonhosted.org:443
        registry.npmjs.org:443
        nodejs.org:443
        go.dev:443
        golang.org:443
        proxy.golang.org:443
        sum.golang.org:443
        sh.rustup.rs:443
        static.rust-lang.org:443
        static.crates.io:443
        index.crates.io:443
        api.adoptium.net:443
        dl.google.com:443
        maven.google.com:443
        repo.maven.apache.org:443
        services.gradle.org:443
        repo.gradle.org:443
        plugins.gradle.org:443
        chaquo.com:443
        auth.docker.io:443
        registry-1.docker.io:443
        download.docker.com:443
        production.cloudfront.docker.com:443
        mirror.gcr.io:443
        *.sigstore.dev:443
        check.trivy.dev:443
        cgr.dev:443
        *.cgr.dev:443
        dl-cdn.alpinelinux.org:443
        *.alpinelinux.org:443
        *.r2.cloudflarestorage.com:443
        *.storage.bunnycdn.com:443
        cdn.quad4.io:443
        dl.flathub.org:443
        flathub.org:443
        api.securityscorecards.dev:443
        meshchatx.com:443
        cdn.playwright.dev:443
        playwright.download.prss.microsoft.com:443
        *.prss.microsoft.com:443
        firefox.settings.services.mozilla.com:443
        *.mozilla.com:443
        storage.googleapis.com:443
        *.stepsecurity.io:443
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    NODE_OPTIONS: --max-old-space-size=8192
    PYTHON_VERSION: "3.14.10"
    NODE_VERSION: "24"
    UV_VERSION: "0.13.6"
    PNPM_VERSION: "12.7.0"

jobs:
    frontend:
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_artifact_run == '' }}
        name: Build frontend artifact
        uses: ./.github/workflows/frontend-build.yml
        permissions:
            contents: read
        with:
            artifact_name: meshchatnext-frontend-native-${{ github.run_id }}-${{ github.run_attempt }}
            retention_days: 1

    native-build:
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_artifact_run == '' }}
        name: Native build (${{ matrix.label }})
        needs: frontend
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      label: windows
                      timeout: 120
                      build_script: scripts/ci/github-build-windows.sh
                    - os: macos-latest
                      label: macos
                      timeout: 180
                      build_script: scripts/ci/github-build-macos.sh
                    - os: macos-15-intel
                      label: macos-x64
                      timeout: 240
                      build_script: scripts/ci/github-build-macos-x64.sh
        runs-on: ${{ matrix.os }}
        timeout-minutes: ${{ matrix.timeout }}
        defaults:
            run:
                shell: bash
        env:
            FRONTEND_ARTIFACT_NAME: ${{ needs.frontend.outputs.artifact_name }}
            MESHCHATNEXT_FRONTEND_PREBUILT: "1"
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: ${{ runner.os == 'Linux' && 'block' || 'audit' }}
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false

            - name: Set up Python and UV
              uses: ./.github/actions/setup-python-uv
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  uv-version: ${{ env.UV_VERSION }}

            - name: Set up Node and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  pnpm-version: ${{ env.PNPM_VERSION }}

            - name: Cache electron downloads and builder toolsets
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: |
                      ~/.cache/electron
                      ~/.cache/electron-builder
                      ~/Library/Caches/electron
                      ~/Library/Caches/electron-builder
                  key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}

            - name: Install dependencies
              if: matrix.label != 'macos-x64'
              run: bash scripts/ci/github-install-deps.sh

            - name: Install x64 macOS native dependencies
              if: matrix.label == 'macos-x64'
              run: bash scripts/ci/github-install-macos-x64-port-deps.sh

            - name: Fetch frontend artifact
              uses: ./.github/actions/fetch-frontend-artifact
              with:
                  artifact-name: ${{ env.FRONTEND_ARTIFACT_NAME }}

            - name: Build and test native Windows SIP helper
              if: matrix.label == 'windows'
              shell: pwsh
              run: ./scripts/ci/github-build-windows-sip.ps1

            - name: Build distributables
              run: bash "${{ matrix.build_script }}"

            - name: AppContainer smoke (Windows only)
              if: matrix.label == 'windows'
              run: uv run python scripts/ci/github-smoke-appcontainer.py --build-dir build/exe

            - name: Collect Windows 0.1.7 review packages
              id: windows-review
              if: matrix.label == 'windows'
              shell: pwsh
              run: |
                  $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  if ($version -ne "0.1.7") { exit 0 }
                  $files = @("dist/MeshchatNext-v0.1.7-win-portable.exe", "dist/MeshchatNext-v0.1.7-win-x64-installer.exe")
                  New-Item -ItemType Directory -Force release-artifacts | Out-Null
                  $assets = @()
                  foreach ($file in $files) {
                      if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing Windows package: $file" }
                      Copy-Item -LiteralPath $file -Destination release-artifacts
                      $item = Get-Item -LiteralPath $file
                      $assets += @{ file = $item.Name; size = $item.Length; sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
                  }
                  @{ source = (git rev-parse HEAD); version = $version; authenticode = "unsigned"; assets = $assets; native_ui = (Get-Content reports/windows-node-ui.json -Raw | ConvertFrom-Json) } | ConvertTo-Json -Depth 5 | Set-Content release-artifacts/SOURCE-PACKAGES.json
                  "ready=true" >> $env:GITHUB_OUTPUT

            - name: Upload approved Windows 0.1.7 review packages
              if: matrix.label == 'windows' && steps.windows-review.outputs.ready == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: next-windows-${{ github.sha }}
                  path: release-artifacts/
                  if-no-files-found: error
                  retention-days: 14

    verify-release-windows:
        name: Verify existing Windows 0.1.7 release packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_artifact_run != '' }}
        runs-on: windows-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
        env:
            MESHCHAT_RELEASE_REVIEW_ROOT: ${{ github.workspace }}/temp-tests/windows-release-review
            MESHCHAT_REVIEW_RUN_ID: ${{ inputs.release_artifact_run }}
            MESHCHATNEXT_BUILD_CHANNEL: stable
            MESHCHATNEXT_GIT_COMMIT: 263b07538d4fcfd58e7020453f9d53fbef19d0d8
            PYTHON_CMD: uv run --frozen --all-extras --group dev python
        steps:
            - name: Harden runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: audit
                  allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
            - name: Assert the fixed release artifact run
              shell: pwsh
              run: |
                  if ($env:MESHCHAT_REVIEW_RUN_ID -ne "42029624165") { throw "Only the immutable 0.1.7 main build is permitted" }
            - name: Preserve exact signed source line endings
              shell: pwsh
              run: git config --global core.autocrlf false
            - name: Checkout verification tooling
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false
            - name: Checkout immutable release source
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  ref: 263b07538d4fcfd58e7020453f9d53fbef19d0d8
                  path: temp-tests/windows-release-review/source
                  persist-credentials: false
            - name: Set up fixed Python and uv
              uses: ./.github/actions/setup-python-uv
              with:
                  python-version: "3.14.10"
                  uv-version: "0.13.6"
            - name: Install frozen release-source dependencies
              shell: bash
              working-directory: temp-tests/windows-release-review/source
              run: uv sync --frozen --all-extras --group dev
            - name: Download only the existing approved Windows artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: next-windows-263b07538d4fcfd58e7020453f9d53fbef19d0d8
                  path: temp-tests/windows-release-review/source/dist
                  run-id: ${{ inputs.release_artifact_run }}
                  github-token: ${{ github.token }}
            - name: Set up fixed Node and pnpm for corrected packaging
              uses: ./.github/actions/setup-node-pnpm
              with:
                  node-version: "24"
                  pnpm-version: "12.7.0"
            - name: Install frozen release packaging dependencies
              working-directory: temp-tests/windows-release-review/source
              shell: bash
              run: pnpm install --frozen-lockfile
            - name: Verify and stage immutable inputs for corrected packaging
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $python = Join-Path $env:MESHCHAT_RELEASE_REVIEW_ROOT "source/.venv/Scripts/python.exe"
                  & $python tests/release/windows_package_review.py prepare
                  if ($LASTEXITCODE -ne 0) { throw "Release input verification failed" }
                  & $python tests/release/windows_package_review.py stage
                  if ($LASTEXITCODE -ne 0) { throw "Immutable backend staging failed" }
            - name: Package Windows with the established neXt publisher
              working-directory: temp-tests/windows-release-review/source
              shell: pwsh
              run: |
                  pnpm run electron-postinstall
                  if ($LASTEXITCODE -ne 0) { throw "Electron packaging dependency setup failed" }
                  pnpm run build-meta:bake
                  if ($LASTEXITCODE -ne 0) { throw "Stable source metadata baking failed" }
                  pnpm run build-backend
                  if ($LASTEXITCODE -ne 0) { throw "Fresh stable backend freeze failed" }
                  foreach ($guard in @("sandbox", "runtime", "codec2", "umsgpack", "bleak")) {
                      bash "scripts/ci/github-verify-frozen-$guard.sh" "build/exe/win32-x64"
                      if ($LASTEXITCODE -ne 0) { throw "Frozen runtime guard failed: $guard" }
                  }
                  $python = Join-Path $env:MESHCHAT_RELEASE_REVIEW_ROOT "source/.venv/Scripts/python.exe"
                  $review = Join-Path $env:GITHUB_WORKSPACE "tests/release/windows_package_review.py"
                  & $python $review frozen
                  if ($LASTEXITCODE -ne 0) { throw "Frozen source/channel verification failed" }
                  $hook = Join-Path $env:GITHUB_WORKSPACE "tests/release/windows_restore_markers.cjs"
                  pnpm exec electron-builder --win portable nsis --x64 --publish=never --config.extraMetadata.author.name=HK1200 --config.afterPack=$hook
                  if ($LASTEXITCODE -ne 0) { throw "Corrected Windows packaging failed" }
            - name: Verify the actual corrected packaged UI in both isolation modes
              working-directory: temp-tests/windows-release-review/source
              shell: pwsh
              run: |
                  node tests/agentic/packaged-node-pages.cjs
                  if ($LASTEXITCODE -ne 0) { throw "Corrected actual Windows UI verification failed" }
            - name: Verify corrected package inputs and native installer profile lifecycle
              shell: pwsh
              run: |
                  $ErrorActionPreference = "Stop"
                  $python = Join-Path $env:MESHCHAT_RELEASE_REVIEW_ROOT "source/.venv/Scripts/python.exe"
                  & $python tests/release/windows_package_review.py record
                  if ($LASTEXITCODE -ne 0) { throw "Corrected package verification failed" }
                  & $python tests/release/windows_upgrade.py
                  if ($LASTEXITCODE -ne 0) { throw "Native installer/profile verification failed" }
                  & $python tests/release/windows_update_staging.py
                  if ($LASTEXITCODE -ne 0) { throw "Native signed updater staging verification failed" }
                  & $python tests/release/windows_package_review.py collect
                  if ($LASTEXITCODE -ne 0) { throw "Release report verification failed" }
            - name: Upload only the approved installers and public source/hash report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: next-windows-verified-263b07538d4fcfd58e7020453f9d53fbef19d0d8
                  path: |
                      temp-tests/windows-release-review/verified-report/MeshchatNext-v0.1.7-win-portable.exe
                      temp-tests/windows-release-review/verified-report/MeshchatNext-v0.1.7-win-x64-installer.exe
                      temp-tests/windows-release-review/verified-report/SOURCE-PACKAGES.json
                  if-no-files-found: error
                  retention-days: 14
