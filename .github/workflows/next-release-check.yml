name: Published neXt release verification
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Published neXt application release tag
                required: true
                type: string
permissions:
    contents: read
jobs:
    verify:
        if: ${{ !startsWith(inputs.tag || github.event.release.tag_name, 'linux-') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
              with:
                  python-version: "3.11"
            - name: Verify published application assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NEXT_UPDATE_SIGNER_HASH: ${{ vars.NEXT_UPDATE_SIGNER_HASH }}
                  NEXT_APK_CERTIFICATE_SHA256: ${{ vars.NEXT_APK_CERTIFICATE_SHA256 }}
                  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  python -m pip install 'rns==1.5.7' 'packaging>=24'
                  gh release download "$RELEASE_TAG" --dir release-check --pattern latest.rsm --pattern latest.json
                  package_tag="$RELEASE_TAG"
                  if [[ "$RELEASE_TAG" == android-stable ]]; then
                      package_tag="$(python -c 'import json; print(json.load(open("release-check/latest.json"))["tag"])')"
                      [[ "$package_tag" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  fi
                  gh release download "$package_tag" --dir release-check \
                      --pattern '*.apk' --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg' \
                      --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' --pattern '*.flatpak' \
                      --pattern '*.zip' --pattern '*.whl' --pattern '*.pyz' --pattern '*.tar.*' --pattern '*.tgz'
                  apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
                  python scripts/ci/verify-next-release.py release-check --tag "$package_tag" --apksigner "$apksigner" --signer-hash "$NEXT_UPDATE_SIGNER_HASH" --certificate-sha256 "$NEXT_APK_CERTIFICATE_SHA256"

    verify-linux:
        if: ${{ startsWith(inputs.tag || github.event.release.tag_name, 'linux-') }}
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
              with:
                  python-version: "3.11"
            - name: Verify published Linux packages and signed update feed
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NEXT_UPDATE_SIGNER_HASH: ${{ vars.NEXT_UPDATE_SIGNER_HASH }}
                  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  python -m pip install 'rns==1.5.7'
                  gh release download "$RELEASE_TAG" --dir release-check --pattern latest.rsm --pattern latest.json
                  package_tag="$(python scripts/ci/verify-linux-release.py release-check --tag "$RELEASE_TAG" --signer "$NEXT_UPDATE_SIGNER_HASH" --manifest-only)"
                  gh release download "$package_tag" --dir release-check --pattern '*.AppImage' --pattern '*.deb'
                  python scripts/ci/verify-linux-release.py release-check --tag "$RELEASE_TAG" --signer "$NEXT_UPDATE_SIGNER_HASH"
            - name: Double-click the signed AppImage under the default Ubuntu policy
              run: |
                  set -euo pipefail
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends thunar xvfb xauth xdotool python3-pyatspi libfuse2t64
                  image="$(realpath "$(find release-check -maxdepth 1 -name '*-linux-x86_64.AppImage' -print -quit)")"
                  bash scripts/ci/ubuntu-desktop-launch.sh "$image"
            - name: Launch the signed Debian package from its desktop entry
              run: |
                  set -euo pipefail
                  deb="$(realpath "$(find release-check -maxdepth 1 -name '*-linux-amd64.deb' -print -quit)")"
                  sudo apt-get install -y --no-install-recommends "$deb"
                  desktop="$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep -E '^/usr/share/applications/.*\.desktop$' | head -1)"
                  bash scripts/ci/ubuntu-desktop-launch.sh "$desktop"
            - name: Start the signed AppImage with an app-specific profile on Ubuntu 26.04
              run: |
                  set -euo pipefail
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends apparmor xvfb xauth
                  image="$(realpath "$(find release-check -maxdepth 1 -name '*-linux-x86_64.AppImage' -print -quit)")"
                  test -f "$image"
                  chmod +x "$image"
                  version="$(python -c 'import json; print(json.load(open("release-check/latest.json"))["version"])')"
                  profile="$(mktemp -d)"
                  mkdir "$profile/rns" "$profile/data"
                  printf '[reticulum]\n  enable_transport = No\n  share_instance = No\n  discover_interfaces = No\n  autoconnect_discovered_interfaces = 0\n[interfaces]\n' > "$profile/rns/config"
                  (cd "$profile" && "$image" --appimage-extract >/dev/null)
                  sudo mv "$profile/squashfs-root" /opt/meshchatnext-appimage-ci
                  sudo chown -R root:root /opt/meshchatnext-appimage-ci
                  sudo chmod -R go-w /opt/meshchatnext-appimage-ci
                  sudo apparmor_parser -r <<'PROFILE'
                  abi <abi/4.0>,
                  include <tunables/global>
                  /opt/meshchatnext-appimage-ci/meshchat-next flags=(unconfined) {
                    userns,
                  }
                  PROFILE
                  setsid xvfb-run -a /opt/meshchatnext-appimage-ci/AppRun --disable-gpu \
                      --storage-dir="$profile/data" --reticulum-config-dir="$profile/rns" \
                      > "$profile/app.log" 2>&1 &
                  pid=$!
                  trap 'kill -- -"$pid" 2>/dev/null || true; tail -50 "$profile/app.log"' EXIT
                  for attempt in {1..60}; do
                      for scheme in https http; do
                          if curl -fksS --max-time 1 "$scheme://127.0.0.1:9338/api/v1/status" \
                              | python -c 'import json,sys; s=json.load(sys.stdin); sys.exit(not (s.get("version")==sys.argv[1] and s.get("network_ready") and s.get("ui_ready")))' "$version" 2>/dev/null; then
                              echo "neXt $version reached Reticulum and UI readiness on Ubuntu 26.04"
                              exit 0
                          fi
                      done
                      kill -0 "$pid" || exit 1
                      sleep 2
                  done
                  exit 1
