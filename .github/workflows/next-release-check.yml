name: Published neXt release verification
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Published neXt application release tag
                required: true
                type: string
permissions:
    contents: read
jobs:
    verify:
        if: ${{ !startsWith(inputs.tag || github.event.release.tag_name, 'linux-') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
              with:
                  python-version: "3.11"
            - name: Verify published application assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NEXT_UPDATE_SIGNER_HASH: ${{ vars.NEXT_UPDATE_SIGNER_HASH }}
                  NEXT_APK_CERTIFICATE_SHA256: ${{ vars.NEXT_APK_CERTIFICATE_SHA256 }}
                  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  python -m pip install 'rns==1.5.7' 'packaging>=24'
                  gh release download "$RELEASE_TAG" --dir release-check --pattern latest.rsm --pattern latest.json
                  package_tag="$RELEASE_TAG"
                  if [[ "$RELEASE_TAG" == android-stable ]]; then
                      package_tag="$(python -c 'import json; print(json.load(open("release-check/latest.json"))["tag"])')"
                      [[ "$package_tag" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  fi
                  gh release download "$package_tag" --dir release-check \
                      --pattern '*.apk' --pattern '*.exe' --pattern '*.msi' --pattern '*.dmg' \
                      --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' --pattern '*.flatpak' \
                      --pattern '*.zip' --pattern '*.whl' --pattern '*.pyz' --pattern '*.tar.*' --pattern '*.tgz'
                  apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
                  python scripts/ci/verify-next-release.py release-check --tag "$package_tag" --apksigner "$apksigner" --signer-hash "$NEXT_UPDATE_SIGNER_HASH" --certificate-sha256 "$NEXT_APK_CERTIFICATE_SHA256"

    verify-linux:
        if: ${{ startsWith(inputs.tag || github.event.release.tag_name, 'linux-') }}
        runs-on: ubuntu-26.04
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
              with:
                  python-version: "3.11"
            - name: Verify published Linux packages and signed update feed
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NEXT_UPDATE_SIGNER_HASH: ${{ vars.NEXT_UPDATE_SIGNER_HASH }}
                  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
              run: |
                  set -euo pipefail
                  python -m pip install 'rns==1.5.7'
                  gh release download "$RELEASE_TAG" --dir release-check --pattern latest.rsm --pattern latest.json
                  package_tag="$(python scripts/ci/verify-linux-release.py release-check --tag "$RELEASE_TAG" --signer "$NEXT_UPDATE_SIGNER_HASH" --manifest-only)"
                  gh release download "$package_tag" --dir release-check --pattern '*.AppImage' --pattern '*.deb'
                  python scripts/ci/verify-linux-release.py release-check --tag "$RELEASE_TAG" --signer "$NEXT_UPDATE_SIGNER_HASH"
            - name: Double-click the signed AppImage under the default Ubuntu policy
              run: |
                  set -euo pipefail
                  sudo apt-get update -qq
                  sudo apt-get install -y --no-install-recommends thunar xvfb xauth xdotool scrot libfuse2t64
                  image="$(realpath "$(find release-check -maxdepth 1 -name '*-linux-x86_64.AppImage' -print -quit)")"
                  bash scripts/ci/ubuntu-desktop-launch.sh "$image"
            - name: Save the isolated desktop test screenshots
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: ubuntu-desktop-launch
                  path: ubuntu-launch-*.png
                  if-no-files-found: ignore
            - name: Launch the signed Debian package from its desktop entry
              run: |
                  set -euo pipefail
                  deb="$(realpath "$(find release-check -maxdepth 1 -name '*-linux-amd64.deb' -print -quit)")"
                  sudo apt-get install -y --no-install-recommends "$deb"
                  desktop="$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep -E '^/usr/share/applications/.*\.desktop$' | head -1)"
                  bash scripts/ci/ubuntu-desktop-launch.sh "$desktop"
            - name: Launch the extracted AppImage with its own AppArmor profile
              run: |
                  set -euo pipefail
                  sudo apt-get install -y --no-install-recommends apparmor
                  image="$(realpath "$(find release-check -maxdepth 1 -name '*-linux-x86_64.AppImage' -print -quit)")"
                  chmod +x "$image"
                  extracted="$(mktemp -d)"
                  (cd "$extracted" && "$image" --appimage-extract >/dev/null)
                  sudo mv "$extracted/squashfs-root" /opt/meshchat-next-appimage
                  sudo chown -R root:root /opt/meshchat-next-appimage
                  sudo chmod -R go-w /opt/meshchat-next-appimage
                  sudo apparmor_parser -r <<'PROFILE'
                  abi <abi/4.0>,
                  include <tunables/global>
                  /opt/meshchat-next-appimage/meshchat-next flags=(unconfined) {
                    userns,
                  }
                  PROFILE
                  cat > "$extracted/meshchat-next-appimage.desktop" <<'DESKTOP'
                  [Desktop Entry]
                  Type=Application
                  Name=Meshchat neXt AppImage
                  Exec=/opt/meshchat-next-appimage/AppRun
                  DESKTOP
                  for attempt in {1..15}; do
                      if ! curl -fkSs --max-time 1 https://127.0.0.1:9338/api/v1/status >/dev/null 2>&1; then
                          break
                      fi
                      sleep 1
                  done
                  bash scripts/ci/ubuntu-desktop-launch.sh "$extracted/meshchat-next-appimage.desktop"
