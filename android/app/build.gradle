}

// Chaquopy's find-links directory is an external dependency input. Track its
// wheel bytes so rebuilding a local wheel cannot leave a stale packaged copy.
tasks.matching { it.name.startsWith("install") && it.name.endsWith("PythonRequirements") }.configureEach {
    inputs.files(fileTree(vendorWheelDir) { include("*.whl") })
        .withPropertyName("androidVendorWheels")
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
}

if (project.hasProperty("meshchatnextRuntimeTests")) {
    android.testBuildType = "release"
    android.defaultConfig.testInstrumentationRunner = "com.meshchatnext.NumpyInstrumentation"
    android.sourceSets.androidTest.java.srcDir(new File(repoRoot, "scripts/android/runtime-tests/java"))
    android.sourceSets.androidTest.assets.srcDir(new File(repoRoot, ".local/android-runtime-assets"))
}

// A visible target prevents vendor background suspension during long diagnostics.
// This overlay is deliberately separate from the ordinary test runner flag.
if (project.hasProperty("meshchatnextRuntimeForeground")) {
    if (!project.hasProperty("meshchatnextRuntimeTests")) throw new org.gradle.api.GradleException("meshchatnextRuntimeForeground requires meshchatnextRuntimeTests")
    android.sourceSets.release.java.srcDir(new File(repoRoot, "scripts/android/runtime-tests/foreground"))
    android.sourceSets.release.manifest.srcFile(new File(repoRoot, "scripts/android/runtime-tests/foreground/AndroidManifest.xml"))
}
